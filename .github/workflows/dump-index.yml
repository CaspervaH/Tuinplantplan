name: Dump index
on:
  push:
    paths: ['.github/workflows/dump-index.yml']
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _tmpdump
          split -n 2 -d index.html _tmpdump/index-part-
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add _tmpdump
          git commit -m "tmp: dump index parts" || echo "no changes"
          git push
