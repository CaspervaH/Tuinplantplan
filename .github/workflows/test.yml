name: Test Tuinplantplanner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Valideer app (syntax, structuur, koppelingen)
        run: node tests/validate.js

  functioneel:
    runs-on: ubuntu-latest
    steps:
      - name: PDOK-adreszoeker werkt (zelfde aanroep als de app)
        run: |
          RESP=$(curl -s "https://api.pdok.nl/bzk/locatieserver/search/v3_1/free?q=Dorpsstraat%2012%2C%20Utrecht&rows=1")
          echo "$RESP" | head -c 300
          echo
          echo "$RESP" | grep -q '"weergavenaam"' || { echo "GEEN weergavenaam in PDOK-antwoord"; exit 1; }
          echo "$RESP" | grep -Eq '"centroide_ll":"POINT\([-0-9.]+ [0-9.]+\)"' || { echo "GEEN geldige centroide_ll"; exit 1; }
          echo "PDOK-adreszoeker OK"

  live-check:
    needs: [validate, functioneel]
    runs-on: ubuntu-latest
    steps:
      - name: Wacht op GitHub Pages deploy
        run: sleep 90
      - name: Controleer live site volledig
        run: |
          BASE="https://caspervah.github.io/Tuinplantplan"
          for i in 1 2 3; do
            HTML=$(curl -sL "$BASE/" || true)
            MAPJS=$(curl -sL -o /dev/null -w "%{http_code}" "$BASE/map.js" || true)
            MAPBODY=$(curl -sL "$BASE/map.js" || true)
            if echo "$HTML" | grep -q 'id="addressGate"' && \
               echo "$HTML" | grep -q 'id="gardenMap"' && \
               echo "$HTML" | grep -q 'leaflet.js' && \
               [ "$MAPJS" = "200" ] && \
               echo "$MAPBODY" | grep -q 'submitGateAddress' && \
               echo "$MAPBODY" | grep -q 'geocodeAddress'; then
              echo "Live site OK: gate, kaart, leaflet en map.js met adres-logica aanwezig."
              exit 0
            fi
            echo "Nog niet klaar of incompleet (map.js HTTP: $MAPJS), poging $i..."
            sleep 60
          done
          echo "LIVE CHECK GEFAALD"
          exit 1
