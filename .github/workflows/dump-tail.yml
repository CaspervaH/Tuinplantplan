name: Tmp dump index tail
on:
  push:
    branches: [main]
    paths: ['scripts/dump-trigger.txt']
jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _tmpdump
          tail -c 15000 index.html > _tmpdump/index-tail.txt
      - name: Commit dump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _tmpdump
          if git diff --cached --quiet; then echo "geen wijzigingen"; else
            git commit -m "tmpdump: index.html tail (tijdelijk)"
            git push
          fi
          git rm -q scripts/dump-trigger.txt
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "tmpdump trigger weg"
          git push
